
[env:jc3248w535c_weather]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
upload_protocol = esptool

build_flags = 
	-DCORE_DEBUG_LEVEL=4
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCONFIG_SPIRAM_SUPPORT=1
	-DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DXQUEUE_SIZE=256
	-DXTASK_MEM_SIZE=32768
	-DMAX_ASYNC_TCP_SLOTS=128

lib_deps = 
	moononournation/GFX Library for Arduino @ ^1.4.9
    https://github.com/me-processware/JC3248W535-Driver.git
;	lovyan03/LovyanGFX@^1.1.16
	;h2zero/NimBLE-Arduino@^1.4.1
	milesburton/DallasTemperature@^3.11.0
	;finitespace/BME280@^3.0.0
	robtillaart/SHT2x@^0.5.5
	robtillaart/SHT31@^0.5.3
	robtillaart/SHT4x@^0.1.3
	sparkfun/SparkFun SCD30 Arduino Library@^1.0.20
	sparkfun/SparkFun High Precision Temperature Sensor TMP117 Qwiic@^1.2.5
	sensirion/sensirion-sps@^1.2.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
